# HBIM-030 — isolated Qwen3-Embedding-8B embedding service (Text Embeddings Inference).
#
# Contract (spec §12, §13, §15, §16, §31, §32):
#   - pinned image tag AND digest; never `latest`
#   - pinned 40-hex model revision; never a floating ref
#   - GPU reserved via the NVIDIA driver
#   - host exposure limited to LOOPBACK (127.0.0.1) only
#   - model cache lives OUTSIDE the repository
#   - healthcheck proves the model is loaded, not merely that the port is open
#   - no privileged mode, no host networking, no embedded credentials

services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9@sha256:aedf3b34836dc57289583142adcf2b93836cda0736ac8e6ce43691b9c2c67170
    container_name: hbim-embeddings-qwen3
    command:
      - --model-id=Qwen/Qwen3-Embedding-8B
      - --revision=1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      - --dtype=float16
      - --max-client-batch-size=64
      - --max-batch-tokens=16384
      - --auto-truncate
    ports:
      # Loopback ONLY. Never bind 0.0.0.0 or a routable interface.
      - "127.0.0.1:8081:80"
    volumes:
      # Hugging Face hub cache, OUTSIDE the repository. Override with HBIM_HF_CACHE.
      - ${HBIM_HF_CACHE:-${HOME}/.cache/huggingface/hub}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # /health returns 200 only once the model is loaded and ready.
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s
    restart: unless-stopped
