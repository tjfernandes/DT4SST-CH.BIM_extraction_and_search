    "retrieval.lexical",
    "retrieval.query_parser",
    "retrieval.router",
    "retrieval.canonical_filters",
    "retrieval.rrf",
    "retrieval.dense",
    "retrieval.hybrid",
    "shared.config",
    "shared.opensearch",
    "shared.security",
    "shared.logging",
    "api.health",
    "api.metrics",
