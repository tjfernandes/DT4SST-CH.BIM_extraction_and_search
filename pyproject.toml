# Configuração de ferramentas apenas (pytest, Ruff, mypy) — HBIM-004.
# Deliberadamente sem [project] e sem [build-system]: nada aqui implica um
# pacote instalável.

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# Integração é opt-in: um `pytest` simples nunca precisa de Docker.
# Testes sem marker são tratados como unitários (incluídos por esta seleção).
addopts = "-m 'not integration'"
markers = [
    "unit: teste unitário (default para testes sem marker; sem rede, sem Docker)",
    "integration: exige Docker local; correr com -o addopts=\"\" -m integration",
    "gpu_service: exige o servico local de embeddings com GPU (HBIM-030); correr com -m gpu_service",
    "model_service: exige modelos de embedding reais locais (HBIM-005B: zembed + Qwen); correr com -m model_service",
    "reranker_service: exige o servico local Qwen3-Reranker (HBIM-051); correr com -m reranker_service",
    "residency_service: exige os servicos locais de embeddings+reranker para o gestor de residencia (HBIM-032); correr com -m residency_service",
    "docling_parser: exige a dependencia minima docling-slim (HBIM-070); correr com -m docling_parser",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "frontend",
    "node_modules",
    "backend/input",
    "backend/output",
    ".venv",
]

[tool.ruff.lint]
# Conjunto inicial deliberadamente pequeno (HBIM-004):
#   E4/E7/E9 — erros de import/statement/sintaxe (E5/E501 excluído: sem
#   rewrites em massa de linhas longas); F — pyflakes; I — ordenação de
#   imports (auto-fix permitido); B — bugbear (adotado: primeira passagem
#   exigiu apenas correções triviais preservadoras de comportamento).
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# Pacotes do backend (rootdir é a raiz do repo; sem isto a classificação
# first-party seria inconsistente entre módulos).
known-first-party = ["api", "ingestion", "shared", "tests", "eval", "canonical", "retrieval"]

[tool.mypy]
python_version = "3.10"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Gate bloqueante: os módulos tipados de HBIM-002/003, todo o backend/eval de
# HBIM-005, todo o backend/canonical de HBIM-010 e o router determinístico de
# HBIM-040 (código novo totalmente tipado — sem dívida de tipagem nova).
