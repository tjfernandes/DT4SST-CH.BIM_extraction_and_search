# CI HBIM (HBIM-004). Sem secrets, sem .env, sem endpoints operacionais:
# todos os valores de ambiente são sintéticos por construção.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSEARCH_HOST: opensearch.example.test
  OPENSEARCH_PASSWORD: synthetic-test-password
  API_KEYS: synthetic-ci-key
  CORS_ALLOW_ORIGINS: http://localhost:5173

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest backend/tests -q -m "not integration" --junitxml=pytest-unit.xml
      - name: Upload JUnit report (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-report
          path: pytest-unit.xml

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dev tooling
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check backend --output-format=github

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: mypy (blocking gate — typed modules + backend/eval + backend/canonical + HBIM-011 ingestion + HBIM-040 retrieval)
        run: >-
          python -m mypy
          backend/retrieval/__init__.py
          backend/retrieval/lexical.py
          backend/retrieval/query_parser.py
          backend/retrieval/router.py
          backend/retrieval/canonical_filters.py
          backend/retrieval/rrf.py
          backend/retrieval/dense.py
          backend/retrieval/hybrid.py
          backend/shared/config.py
          backend/shared/opensearch.py
          backend/shared/security.py
          backend/shared/logging.py
          backend/api/health.py
          backend/api/metrics.py
          backend/api/middleware.py
          backend/api/errors.py
          backend/eval/dataset.py
          backend/eval/metrics.py
          backend/eval/run_eval.py
          backend/canonical/schema.py
          backend/canonical/ids.py
          backend/canonical/serialization.py
          backend/ingestion/canonical_ifc.py
          backend/ingestion/ifc_spatial.py
          backend/ingestion/ifc_materials.py
          backend/ingestion/ifc_values.py
          backend/ingestion/ifc_properties.py
          backend/ingestion/property_facts.py
          backend/ingestion/index_lifecycle.py
          backend/ingestion/migrate.py
          backend/ingestion/indexers/__init__.py
          backend/ingestion/indexers/__main__.py
          backend/ingestion/indexers/common.py
          backend/ingestion/indexers/registry.py
          backend/ingestion/indexers/elements_indexer.py
          backend/ingestion/indexers/property_facts_indexer.py
          backend/ingestion/indexers/classification_facts_indexer.py
          backend/ingestion/indexers/documents_indexer.py
          backend/ingestion/indexers/cli.py
          backend/models/embeddings_qwen3.py
          backend/models/reranker_qwen3.py
          backend/retrieval/rerank_projection.py
          backend/retrieval/rerank.py
          backend/api/snapshot.py
          backend/retrieval/evidence.py
          backend/api/schemas.py
          backend/api/responses.py
          backend/eval/grounding_eval.py
          backend/models/residency.py
          backend/models/residency_adapters.py
          backend/api/ops.py
          backend/eval/rerank_threshold.py
          backend/eval/rerank_eval.py
          backend/eval/bench/embedding_latency.py
          backend/eval/text_projection.py
          backend/eval/semantic_gold_dataset.py
          backend/eval/run_semantic_baseline.py
          backend/eval/models/__init__.py
          backend/eval/models/zembed_adapter.py
          backend/eval/models/qwen_adapter.py
          backend/eval/dim_selector.py
          backend/eval/dim_benchmark.py
          backend/eval/hybrid_eval.py
          backend/eval/gates.py
          backend/eval/document_eval.py
          backend/eval/ocr_eval.py
          backend/eval/entity_linking_eval.py
          backend/ingestion/entity_linking.py
          backend/canonical/documents.py
          backend/ingestion/document_blocks.py
          backend/ingestion/page_regions.py
          backend/ingestion/page_classifier.py
          backend/ingestion/rasterize.py
          backend/ingestion/ocr_engine.py
          backend/ingestion/chunking.py
          backend/ingestion/indexers/elements_dense.py
          backend/retrieval/document_projection.py
          backend/retrieval/document_lexical.py
          backend/retrieval/document_hybrid.py
          backend/retrieval/document_retrieval.py
          backend/ingestion/indexers/chunks_dense.py
          backend/eval/document_retrieval_eval.py
          backend/graph/__init__.py
          backend/graph/ids.py
          backend/graph/serialization.py
          backend/graph/predicates.py
          backend/graph/validation.py
          backend/graph/schema.py
          backend/graph/adapters/__init__.py
          backend/graph/adapters/base.py
          backend/graph/adapters/ifcopenshell_adapter.py
          backend/eval/graph_fixtures.py
          backend/eval/graph_pipeline_selector.py
          backend/eval/graph_pipeline_benchmark.py
          backend/geometry/__init__.py
          backend/geometry/ids.py
          backend/geometry/numerics.py
          backend/geometry/serialization.py
          backend/geometry/units.py
          backend/geometry/validation.py
          backend/geometry/algorithms.py
          backend/geometry/schema.py
          backend/geometry/extractor.py
          backend/geometry/indexer.py
          backend/eval/geometry_fixtures.py
          backend/eval/geometry_gold.py
          backend/eval/geometry_conformance.py
          backend/eval/geometry_benchmark.py
          backend/relations/__init__.py
          backend/relations/ids.py
          backend/relations/validation.py
          backend/relations/schema.py
          backend/relations/serialization.py
          backend/relations/assembler.py
          backend/relations/native_ifc.py
          backend/relations/derived.py
          backend/relations/broad_phase.py
          backend/relations/selectors.py
          backend/eval/relation_fixtures.py
          backend/eval/relation_gold.py
          backend/eval/relation_benchmark.py

  document-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Real Docling PDFium parse (HBIM-070; offline, no model weights)
        run: python -m pytest backend/tests -q -o addopts="" -m docling_parser
        env:
          HF_HUB_OFFLINE: "1"

  regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run regression gates (HBIM-060; pure slices, fail-closed, no Docker)
        run: python -m eval.gates run --ci --report-dir eval/reports/gates
        working-directory: backend
      - name: Upload gates report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gates-report
          path: backend/eval/reports/gates/**

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  integration-opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-unit]
    env:
      HBIM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run OpenSearch integration tests (Testcontainers)
        # gpu_service is deselected: it needs the local GPU embedding service
        # (HBIM-030), not OpenSearch, and never runs in CI.
        run: python -m pytest backend/tests -q -o addopts="" -m "integration and not gpu_service and not model_service and not docling_parser and not ocr_service"

  evaluation-opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-unit]
    env:
      HBIM_REQUIRE_DOCKER: "1"
      # Direct the run report into a fixed path so it can be uploaded; the
      # committed baseline (backend/eval/baselines/current_system.json) is the
      # gate — CI only reproduces, compares and publishes, never approves it.
      HBIM_EVAL_REPORT_DIR: backend/eval/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run evaluation baseline (Testcontainers; gates against committed baseline)
        run: python -m pytest backend/tests/integration/test_eval_baseline.py -q -o addopts="" -m integration
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: backend/eval/reports/**
