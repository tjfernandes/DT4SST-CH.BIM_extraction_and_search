# CI HBIM (HBIM-004). Sem secrets, sem .env, sem endpoints operacionais:
# todos os valores de ambiente são sintéticos por construção.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSEARCH_HOST: opensearch.example.test
  OPENSEARCH_PASSWORD: synthetic-test-password
  API_KEYS: synthetic-ci-key
  CORS_ALLOW_ORIGINS: http://localhost:5173

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest backend/tests -q -m "not integration" --junitxml=pytest-unit.xml
      - name: Upload JUnit report (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-report
          path: pytest-unit.xml

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dev tooling
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check backend --output-format=github

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: mypy (blocking gate — typed modules + backend/eval + backend/canonical + HBIM-011 ingestion)
        run: >-
          python -m mypy
          backend/shared/config.py
          backend/shared/opensearch.py
          backend/shared/security.py
          backend/shared/logging.py
          backend/api/health.py
          backend/api/metrics.py
          backend/api/middleware.py
          backend/api/errors.py
          backend/eval/dataset.py
          backend/eval/metrics.py
          backend/eval/run_eval.py
          backend/canonical/schema.py
          backend/canonical/ids.py
          backend/canonical/serialization.py
          backend/ingestion/canonical_ifc.py
          backend/ingestion/ifc_spatial.py
          backend/ingestion/ifc_materials.py
          backend/ingestion/ifc_values.py
          backend/ingestion/ifc_properties.py
          backend/ingestion/property_facts.py
          backend/ingestion/index_lifecycle.py
          backend/ingestion/migrate.py
          backend/ingestion/indexers/__init__.py
          backend/ingestion/indexers/__main__.py
          backend/ingestion/indexers/common.py
          backend/ingestion/indexers/registry.py
          backend/ingestion/indexers/elements_indexer.py
          backend/ingestion/indexers/property_facts_indexer.py
          backend/ingestion/indexers/classification_facts_indexer.py
          backend/ingestion/indexers/documents_indexer.py
          backend/ingestion/indexers/cli.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  integration-opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-unit]
    env:
      HBIM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run OpenSearch integration tests (Testcontainers)
        run: python -m pytest backend/tests -q -o addopts="" -m integration

  evaluation-opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-unit]
    env:
      HBIM_REQUIRE_DOCKER: "1"
      # Direct the run report into a fixed path so it can be uploaded; the
      # committed baseline (backend/eval/baselines/current_system.json) is the
      # gate — CI only reproduces, compares and publishes, never approves it.
      HBIM_EVAL_REPORT_DIR: backend/eval/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (runtime + dev; sem requirements-ml.txt)
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run evaluation baseline (Testcontainers; gates against committed baseline)
        run: python -m pytest backend/tests/integration/test_eval_baseline.py -q -o addopts="" -m integration
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: backend/eval/reports/**
